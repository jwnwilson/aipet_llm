[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "llm-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # API / proxy / temporal-worker base — no ML frameworks
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.3",
    "PyJWT>=2.8",
    "cryptography>=42.0",
    "temporalio>=1.27.0",
    "uvicorn>=0.46.0",
    "boto3>=1.35",
    "sqlalchemy>=2.0.49",
    "alembic>=1.18.4",
    "tqdm>=4.67.3",
    "psycopg2-binary>=2.9.12",
    "kubernetes>=31.0,<36.0",  # v36 broke in-cluster auth (api_key key renamed BearerToken but loader still uses authorization)
    # Lightweight compute-backend clients (used by temporal worker activities)
    "kaggle>=1.6",
    "runpod>=1.7",
    "vastai>=1.0",
    "sse-starlette>=2.1.0",
]

[project.optional-dependencies]
inference = [
    # Requires C++ compilation — install locally for RPi inference, not on training instances.
    "llama-cpp-python>=0.3.22",
]
training = [
    # Heavy ML frameworks — only needed when running local fine-tuning (domain/train/).
    # Not installed in the proxy or inference images.
    "torch>=2.5",
    "transformers>=5.7.0",
    "datasets>=4.8.5",
    "accelerate>=1.1.0",
    "bitsandbytes>=0.43.0",
    "peft>=0.9.0",
    "sentencepiece>=0.2.0",
]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-xdist>=3.0.0",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.3.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "types-tqdm>=4.67.3.20260508",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-n auto --dist=loadfile --timeout=120"
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s %(levelname)-8s %(name)s  %(message)s"
log_cli_date_format = "%H:%M:%S"
markers = [
    "slow: marks tests as slow — downloads models, trains, exports (deselect with '-m \"not slow\"')",
    "gpu: marks tests that require a CUDA GPU (skip on CPU/MPS machines)",
    "kaggle: marks tests that submit real Kaggle kernels (requires KAGGLE_USERNAME + KAGGLE_KEY or KAGGLE_API_TOKEN)",
    "runpod: marks tests that provision real RunPod pods (requires RUNPOD_API_KEY + AWS credentials)",
    "vastai: marks tests that rent real Vast.ai instances (requires VAST_API_KEY + AWS credentials)",
]
