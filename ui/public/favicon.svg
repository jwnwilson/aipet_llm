<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Editorial Scientific: warm paper + ink border + monospace logotype -->

  <!-- Warm paper background -->
  <rect width="32" height="32" rx="5" fill="#fafaf7"/>

  <!-- Ink border — printed/stamped feel -->
  <rect x="1" y="1" width="30" height="30" rx="4"
    stroke="#1c1a17" stroke-width="1.5"/>

  <!-- Thin rule above logotype -->
  <line x1="7" y1="11" x2="25" y2="11"
    stroke="#1c1a17" stroke-width="0.75" stroke-linecap="round" opacity="0.35"/>

  <!-- "llm" in ink, monospace -->
  <text
    x="16"
    y="22"
    font-family="ui-monospace,'SF Mono','Cascadia Code','Consolas',monospace"
    font-size="13"
    font-weight="700"
    fill="#1c1a17"
    text-anchor="middle"
  >llm</text>

  <!-- Thin rule below logotype -->
  <line x1="7" y1="25.5" x2="25" y2="25.5"
    stroke="#1c1a17" stroke-width="0.75" stroke-linecap="round" opacity="0.35"/>
</svg>
