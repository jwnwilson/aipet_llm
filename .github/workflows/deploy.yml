name: Build and Deploy

on:
  workflow_run:
    workflows: [Test]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# OIDC requires id-token:write; contents:read is the minimum for checkout.
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_PROXY_REPOSITORY: llm-api-proxy
  ECR_INFERENCE_REPOSITORY: llm-api-inference
  ECR_TRAINING_REPOSITORY: llm-api-training
  ECR_EXPORT_REPOSITORY: llm-api-export
  ECR_TEMPORAL_UI_REPOSITORY: llm-api-temporal-ui
  ECR_RUNPOD_REPOSITORY: ${{ vars.ECR_RUNPOD_REPOSITORY }}

jobs:
  # ── Changes: detect which images need rebuilding ──────────────────────────
  changes:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      proxy: ${{ steps.filter.outputs.proxy }}
      inference: ${{ steps.filter.outputs.inference }}
      training: ${{ steps.filter.outputs.training }}
      export: ${{ steps.filter.outputs.export }}
      runpod: ${{ steps.filter.outputs.runpod }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            proxy:
              - 'docker/proxy/Dockerfile'
              - 'src/**'
              - 'pyproject.toml'
              - 'uv.lock'
            inference:
              - 'docker/inference/**'
              - 'src/adapters/inference.py'
              - 'src/adapters/prompt.py'
              - 'src/adapters/storage/s3.py'
              - 'src/domain/**'
              - 'pyproject.toml'
              - 'uv.lock'
            training:
              - 'docker/training/Dockerfile'
              - 'src/**'
              - 'pyproject.toml'
              - 'uv.lock'
            export:
              - 'docker/export/Dockerfile'
              - 'src/**'
              - 'llama.cpp/**'
              - 'pyproject.toml'
              - 'uv.lock'
            runpod:
              - 'docker/runpod/Dockerfile'
              - 'pyproject.toml'
              - 'uv.lock'

  # ── Build: push ARM64 images to ECR ───────────────────────────────────────
  build:
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      proxy_image: ${{ steps.proxy-image.outputs.image }}
      inference_image: ${{ steps.inference-image.outputs.image }}
      training_image: ${{ steps.training-image.outputs.image }}
      export_image: ${{ steps.export-image.outputs.image }}
      runpod_image: ${{ steps.runpod-image.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Login to Amazon ECR Public (for RunPod image — public registry, us-east-1 only)
        id: login-ecr-public
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Set up QEMU (required for linux/arm64 cross-compilation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Proxy API image (lightweight — no torch/llama-cpp) ─────────────────
      - name: Build and push proxy API image (ARM64)
        if: ${{ needs.changes.outputs.proxy == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/proxy/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_PROXY_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_PROXY_REPOSITORY }}:latest
          cache-from: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_PROXY_REPOSITORY }}:buildcache
          cache-to: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_PROXY_REPOSITORY }}:buildcache,mode=min

      - name: Export proxy image ref
        id: proxy-image
        run: |
          REGISTRY=${{ steps.login-ecr.outputs.registry }}
          REPO=${{ env.ECR_PROXY_REPOSITORY }}
          if [ "${{ needs.changes.outputs.proxy }}" = "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "image=${REGISTRY}/${REPO}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            DIGEST=$(aws ecr describe-images --repository-name "${REPO}" \
              --image-ids imageTag=latest \
              --query 'imageDetails[0].imageDigest' --output text)
            echo "image=${REGISTRY}/${REPO}@${DIGEST}" >> "$GITHUB_OUTPUT"
          fi

      # ── Inference worker image (heavy — llama-cpp-python cached at layer) ──
      - name: Build and push inference worker image (ARM64)
        if: ${{ needs.changes.outputs.inference == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/inference/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_INFERENCE_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_INFERENCE_REPOSITORY }}:latest
          cache-from: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_INFERENCE_REPOSITORY }}:buildcache
          cache-to: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_INFERENCE_REPOSITORY }}:buildcache,mode=min

      - name: Export inference worker image ref
        id: inference-image
        run: |
          REGISTRY=${{ steps.login-ecr.outputs.registry }}
          REPO=${{ env.ECR_INFERENCE_REPOSITORY }}
          if [ "${{ needs.changes.outputs.inference }}" = "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "image=${REGISTRY}/${REPO}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            DIGEST=$(aws ecr describe-images --repository-name "${REPO}" \
              --image-ids imageTag=latest \
              --query 'imageDetails[0].imageDigest' --output text)
            echo "image=${REGISTRY}/${REPO}@${DIGEST}" >> "$GITHUB_OUTPUT"
          fi

      # ── Training image (torch/transformers — k8s training Jobs) ──────────────
      - name: Build and push training image (ARM64)
        if: ${{ needs.changes.outputs.training == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/training/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_TRAINING_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_TRAINING_REPOSITORY }}:latest
          cache-from: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_TRAINING_REPOSITORY }}:buildcache
          cache-to: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_TRAINING_REPOSITORY }}:buildcache,mode=min

      - name: Export training image ref
        id: training-image
        run: |
          REGISTRY=${{ steps.login-ecr.outputs.registry }}
          REPO=${{ env.ECR_TRAINING_REPOSITORY }}
          if [ "${{ needs.changes.outputs.training }}" = "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "image=${REGISTRY}/${REPO}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            DIGEST=$(aws ecr describe-images --repository-name "${REPO}" \
              --image-ids imageTag=latest \
              --query 'imageDetails[0].imageDigest' --output text)
            echo "image=${REGISTRY}/${REPO}@${DIGEST}" >> "$GITHUB_OUTPUT"
          fi

      # ── Export image (llama.cpp pre-built — k8s GGUF-export Jobs) ────────
      - name: Build and push export image (ARM64)
        if: ${{ needs.changes.outputs.export == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/export/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_EXPORT_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_EXPORT_REPOSITORY }}:latest
          cache-from: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_EXPORT_REPOSITORY }}:buildcache
          cache-to: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_EXPORT_REPOSITORY }}:buildcache,mode=min

      - name: Export export image ref
        id: export-image
        run: |
          REGISTRY=${{ steps.login-ecr.outputs.registry }}
          REPO=${{ env.ECR_EXPORT_REPOSITORY }}
          if [ "${{ needs.changes.outputs.export }}" = "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "image=${REGISTRY}/${REPO}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            DIGEST=$(aws ecr describe-images --repository-name "${REPO}" \
              --image-ids imageTag=latest \
              --query 'imageDetails[0].imageDigest' --output text)
            echo "image=${REGISTRY}/${REPO}@${DIGEST}" >> "$GITHUB_OUTPUT"
          fi

      # ── RunPod training image (AMD64 + CUDA — public ECR, no auth required) ──
      - name: Build and push RunPod training image (AMD64)
        if: ${{ needs.changes.outputs.runpod == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/runpod/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.ECR_RUNPOD_REPOSITORY }}:${{ github.sha }}
            ${{ env.ECR_RUNPOD_REPOSITORY }}:latest
          cache-from: type=registry,ref=${{ env.ECR_RUNPOD_REPOSITORY }}:buildcache
          cache-to: type=registry,ref=${{ env.ECR_RUNPOD_REPOSITORY }}:buildcache,mode=min

      - name: Export RunPod image ref
        id: runpod-image
        run: |
          REPO=${{ env.ECR_RUNPOD_REPOSITORY }}
          if [ "${{ needs.changes.outputs.runpod }}" = "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "image=${REPO}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            DIGEST=$(docker buildx imagetools inspect "${REPO}:latest" \
              --format '{{json .Manifest.Digest}}' 2>/dev/null | tr -d '"')
            echo "image=${REPO}@${DIGEST}" >> "$GITHUB_OUTPUT"
          fi

  # ── Deploy: apply manifests via kubeconfig secret ─────────────────────────
  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Prevent two deploy+smoke runs from racing against each other.
    # cancel-in-progress: false queues the newer run rather than killing
    # an in-flight deploy, which could leave the cluster in a partial state.
    concurrency:
      group: deploy-to-production
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    env:
      PROXY_IMAGE: ${{ needs.build.outputs.proxy_image }}
      INFERENCE_IMAGE: ${{ needs.build.outputs.inference_image }}
      TRAINING_IMAGE: ${{ needs.build.outputs.training_image }}
      EXPORT_IMAGE: ${{ needs.build.outputs.export_image }}
      RUNPOD_IMAGE: ${{ needs.build.outputs.runpod_image }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Write kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Sync llm-api-secrets in k8s
        run: |
          kubectl create secret generic llm-api-secrets \
            --from-literal=aws-s3-bucket=${{ secrets.AWS_S3_BUCKET }} \
            --from-literal=aws-access-key-id=${{ secrets.AIPET_AWS_ACCESS_KEY_ID }} \
            --from-literal=aws-secret-access-key=${{ secrets.AIPET_AWS_SECRET_ACCESS_KEY }} \
            --from-literal=kaggle-username=${{ secrets.KAGGLE_USERNAME }} \
            --from-literal=kaggle-key=${{ secrets.KAGGLE_KEY }} \
            --from-literal=kaggle-aws-access-key-id=${{ secrets.KAGGLE_AWS_ACCESS_KEY_ID }} \
            --from-literal=kaggle-aws-secret-access-key=${{ secrets.KAGGLE_AWS_SECRET_ACCESS_KEY }} \
            --from-literal=runpod-api-key=${{ secrets.RUNPOD_API_KEY }} \
            --from-literal=vast-api-key=${{ secrets.VAST_API_KEY }} \
            --from-literal=cors-origins=${{ secrets.CORS_ORIGINS }} \
            --from-literal=auth0-domain=${{ secrets.AUTH0_DOMAIN }} \
            --from-literal=auth0-audience=${{ secrets.AUTH0_AUDIENCE }} \
            --from-literal=auth0-client-id=${{ secrets.AUTH0_CLIENT_ID }} \
            --from-literal=auth0-mgmt-client-id=${{ secrets.AUTH0_MGMT_CLIENT_ID }} \
            --from-literal=auth0-mgmt-client-secret=${{ secrets.AUTH0_MGMT_CLIENT_SECRET }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Sync llm-api-db-secret in k8s
        run: |
          kubectl create secret generic llm-api-db-secret \
            --from-literal=postgres-user=aipet \
            --from-literal=postgres-password="${{ secrets.AIPET_DB_PASSWORD }}" \
            --from-literal=postgres-db=aipet \
            --from-literal=database-url="postgresql+psycopg2://aipet:${{ secrets.AIPET_DB_PASSWORD }}@llm-api-db:5432/aipet" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Refresh ECR pull credentials in k8s
        run: |
          AWS_ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          kubectl create secret docker-registry ecr-credentials \
            --docker-server=${AWS_ACCOUNT}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com \
            --docker-username=AWS \
            --docker-password="$(aws ecr get-login-password --region ${{ env.AWS_REGION }})" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Mirror Temporal UI image to ECR (skip if already current)
        run: |
          AWS_ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          ECR_REGISTRY="${AWS_ACCOUNT}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
          ECR_IMAGE="${ECR_REGISTRY}/${{ env.ECR_TEMPORAL_UI_REPOSITORY }}:latest"
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
            docker login --username AWS --password-stdin "${ECR_REGISTRY}"
          SRC_DIGEST=$(docker buildx imagetools inspect temporalio/ui:latest \
            --format '{{json .Manifest.Digest}}' 2>/dev/null | tr -d '"' || true)
          DST_DIGEST=$(aws ecr describe-images \
            --repository-name ${{ env.ECR_TEMPORAL_UI_REPOSITORY }} \
            --image-ids imageTag=latest \
            --query 'imageDetails[0].imageDigest' \
            --output text 2>/dev/null || true)
          if [ "${SRC_DIGEST}" = "${DST_DIGEST}" ] && [ -n "${SRC_DIGEST}" ]; then
            echo "Temporal UI already at ${SRC_DIGEST}, skipping mirror."
          else
            echo "Mirroring Temporal UI (src=${SRC_DIGEST}, ecr=${DST_DIGEST})"
            docker buildx imagetools create -t "${ECR_IMAGE}" temporalio/ui:latest
          fi
          echo "TEMPORAL_UI_IMAGE=${ECR_IMAGE}" >> "$GITHUB_ENV"

      - name: Apply k8s manifests
        run: |
          # Stamp proxy API image into the main deployment and temporal worker
          sed -i "s|<ECR_PROXY_IMAGE>|$PROXY_IMAGE|g" \
            infra/k8s/llm-api/deployment.yaml \
            infra/k8s/temporal/worker.yaml
          # Stamp inference worker image so the proxy can spawn pods with the correct tag
          sed -i "s|<ECR_INFERENCE_IMAGE>|$INFERENCE_IMAGE|g" \
            infra/k8s/llm-api/deployment.yaml
          # Stamp training image into temporal worker so K8sTrainingAdapter knows which image to use
          sed -i "s|<ECR_TRAINING_IMAGE>|$TRAINING_IMAGE|g" \
            infra/k8s/temporal/worker.yaml
          sed -i "s|<ECR_EXPORT_IMAGE>|$EXPORT_IMAGE|g" \
            infra/k8s/temporal/worker.yaml
          sed -i "s|<ECR_RUNPOD_IMAGE>|$RUNPOD_IMAGE|g" \
            infra/k8s/temporal/worker.yaml
          sed -i "s|<TEMPORAL_UI_IMAGE>|$TEMPORAL_UI_IMAGE|g" \
            infra/k8s/temporal/server.yaml
          # Apply and wait for the database before rolling out the app so that
          # db_migrate can resolve the "llm-api-db" hostname on first boot.
          kubectl apply -f infra/k8s/llm-api/postgres.yaml
          kubectl rollout status statefulset/llm-api-db --timeout=120s
          # Exclude infra/k8s/nginx/ — the ingress-nginx Service is owned by Rancher's
          # Helm App. Applying it here strips Helm labels, triggering Rancher to delete
          # and recreate the Service, which GC-s the inlets Tunnel CRD and forces a new
          # DigitalOcean droplet (new IP), breaking DNS on every deploy.
          # Use infra/k8s/nginx/service.yaml manually only during cluster-wipe recovery.
          find infra/k8s/ -name '*.yaml' ! -name '*.example.yaml' ! -path '*/nginx/*' | sort | xargs -I{} kubectl apply -f {}

      - name: Wait for rollouts
        run: |
          kubectl rollout status deployment/llm-api --timeout=600s
          kubectl rollout status deployment/temporal-worker --timeout=600s

      # - name: Sync Route53 DNS to current inlets exit-node IP
      #   run: |
      #     TUNNEL_IP=$(kubectl get tunnel ingress-nginx-controller-tunnel \
      #       -o jsonpath='{.status.hostIP}' 2>/dev/null || true)
      #     if [ -z "$TUNNEL_IP" ]; then
      #       echo "WARNING: could not read tunnel IP — skipping DNS sync"
      #       exit 0
      #     fi
      #     TUNNEL_IP="$TUNNEL_IP" python3 scripts/sync_route53_dns.py

      - name: Install smoke test dependencies
        run: pip install httpx

      - name: Run smoke tests (all backends in parallel)
        env:
          API_URL: https://llm-api.jwnwilson.co.uk
          AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
          AUTH0_MGMT_CLIENT_ID: ${{ secrets.AUTH0_MGMT_CLIENT_ID }}
          AUTH0_MGMT_CLIENT_SECRET: ${{ secrets.AUTH0_MGMT_CLIENT_SECRET }}
          AUTH0_AUDIENCE: ${{ secrets.AUTH0_AUDIENCE }}
        run: python3 ./scripts/smoke_test_all.py
