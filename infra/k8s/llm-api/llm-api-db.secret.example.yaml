# Copy to llm-api-db.secret.yaml (gitignored) and replace CHANGE_ME before deploying locally.
# In CI, this secret is synced from GitHub Actions secrets by deploy.yml.
# Apply locally with: kubectl apply -f infra/k8s/llm-api/llm-api-db.secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: llm-api-db-secret
type: Opaque
stringData:
  postgres-user: "llm-api"
  postgres-password: "CHANGE_ME"
  postgres-db: "llm-api"
  database-url: "postgresql+psycopg2://llm-api:CHANGE_ME@llm-api-db:5432/llm-api"
