apiVersion: v1
kind: Secret
metadata:
  name: inlets-client-secret
  namespace: default
type: Opaque
stringData:
  # Plain-text inlets-pro auth token — must match the value on the DO exit node
  token: REPLACE_WITH_INLETS_TOKEN
  # Full inlets-pro license key — copy from your inlets account
  license: REPLACE_WITH_INLETS_LICENSE
