version: "3.9"
services:
  proxy:
    build:
      context: .
      dockerfile: docker/proxy/Dockerfile
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql://llm:llm@db:5432/llm
      K8S_MOCK: "true"
      INFERENCE_WORKER_URL: http://inference:8080
    depends_on: [db]

  inference:
    build:
      context: .
      dockerfile: docker/inference/Dockerfile
    ports: ["8080:8080"]
    volumes:
      - ./models:/models:ro
    environment:
      GGUF_PATH: /models/model.gguf

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: llm
      POSTGRES_PASSWORD: llm
      POSTGRES_DB: llm
    volumes: [pgdata:/var/lib/postgresql/data]

volumes:
  pgdata:
